version: '3.8'

services:
  # MongoDB Database Service
  mongodb:
    image: mongo:7.0
    container_name: shopsphere-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - shopsphere_db_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: shopsphere

  # Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shopsphere-backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    depends_on:
      - mongodb
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/shopsphere
      CLIENT_URL: http://localhost:5173,http://localhost:3000
      JWT_ACCESS_SECRET: shopsphere_super_secure_access_secret_docker_compose_32chars
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_SECRET: shopsphere_super_secure_refresh_secret_docker_compose_32chars
      JWT_REFRESH_EXPIRY: 7d
      COOKIE_SAME_SITE: lax
      COOKIE_SECURE: "false"
      SMS_PROVIDER: DEVELOPMENT_MOCK

volumes:
  shopsphere_db_data:
